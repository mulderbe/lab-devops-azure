name: App en Container Apps

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/containerapp-deploy.yml"
  workflow_dispatch: # para volver a desplegar después de recrear el stack

permissions:
  contents: read
  id-token: write

concurrency:
  group: containerapp-dev
  cancel-in-progress: false

env:
  RG: rg-lab-dev
  APP: ca-web-lab-dev

jobs:
  deploy:
    name: Construir y desplegar la app web
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Datos del registry y versión
        run: |
          ACR=$(az acr list -g "$RG" --query '[0].name' -o tsv)
          {
            echo "ACR=$ACR"
            echo "ACR_SERVIDOR=$(az acr show -n "$ACR" --query loginServer -o tsv)"
            # r + 7 letras del commit + número de ejecución: único y válido como nombre de revisión.
            echo "VERSION=r${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_ENV"

      - name: Construir y subir la imagen
        run: |
          az acr login --name "$ACR"
          docker build --build-arg VERSION="$VERSION" -t "$ACR_SERVIDOR/web:$VERSION" apps/web
          docker push "$ACR_SERVIDOR/web:$VERSION"

      - name: Crear la revisión nueva
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update -n "$APP" -g "$RG" \
            --image "$ACR_SERVIDOR/web:$VERSION" \
            --revision-suffix "$VERSION"

      - name: Publicar el estado en el resumen
        run: |
          HOST=$(az functionapp show -g "$RG" -n "$FUNC" --query properties.defaultHostName -o tsv)
          if [ -z "$HOST" ]; then
            echo "::error::No se pudo obtener el host de $FUNC"
            exit 1
          fi
          URL="https://$HOST/api/hola"
          {
            echo "## Function en Flex Consumption"
            echo "URL: $URL"
            echo '```'
            curl -sS --fail-with-body --retry 5 --retry-delay 15 --retry-all-errors "$URL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
