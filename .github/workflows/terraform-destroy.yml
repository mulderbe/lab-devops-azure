name: Terraform destroy (manual)

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Escribe destroy-dev para confirmar"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_IN_AUTOMATION: "true"

jobs:
  destroy:
    name: Destroy de dev
    if: inputs.confirmar == 'destroy-dev' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Plan de destrucción
        run: terraform plan -destroy -input=false -lock-timeout=5m -var-file=dev.tfvars -out=tfdestroy

      - name: Destroy
        run: terraform apply -input=false -lock-timeout=5m tfdestroy
