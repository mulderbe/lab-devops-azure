name: Terraform drift

on:
  schedule:
    - cron: "0 13 * * 1-5" # 08:00 en Lima, de lunes a viernes
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_IN_AUTOMATION: "true"

jobs:
  drift:
    name: Detectar drift en dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Plan de solo lectura
        run: |
          set +e
          terraform plan -input=false -lock=false -var-file=dev.tfvars -detailed-exitcode -no-color > plan.txt 2>&1
          codigo=$?
          set -e
          if [ "$codigo" -eq 0 ]; then
            echo "## Sin drift: Azure coincide con el código" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$codigo" -eq 1 ]; then titulo="El plan falló"; else titulo="Drift detectado en dev"; fi
          {
            echo "## $titulo"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
