# La identidad del Pod dentro de Kubernetes. La anotación la une a id-app-lab-dev (Paso 7).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-app
  namespace: app
  annotations:
    azure.workload.identity/client-id: "${APP_CLIENT_ID}"
---
# Deployment: "quiero 2 copias de este contenedor, siempre".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        azure.workload.identity/use: "true" # Paso 7: inyecta el token de la identidad
    spec:
      serviceAccountName: sa-app
      containers:
        - name: web
          image: mcr.microsoft.com/azuredocs/aks-helloworld:v1
          ports:
            - containerPort: 80
          env:
            - name: TITLE
              value: "Lab 4 de 6 - AKS de Cristhian"
          resources:
            requests: # lo que el scheduler reserva en el nodo
              cpu: 50m
              memory: 64Mi
            limits: # lo máximo que puede usar
              cpu: 250m
              memory: 128Mi
          readinessProbe: # ¿ya puede recibir tráfico?
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe: # ¿sigue vivo? Si no, Kubernetes lo reinicia
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts: # Paso 7: los secretos aparecen como archivos
            - name: secretos
              mountPath: /mnt/secretos
              readOnly: true
      volumes: # Paso 7
        - name: secretos
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: kv-lab

---
# Service LoadBalancer: AKS crea una IP pública en el balanceador y reparte el tráfico entre los Pods.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: app
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
