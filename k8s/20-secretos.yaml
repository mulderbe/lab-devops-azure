# SecretProviderClass: "de ESTE Key Vault, trae ESTOS secretos, entrando con ESTA identidad".
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: kv-lab
  namespace: app
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${APP_CLIENT_ID}" # id-app-lab-dev (Workload Identity)
    keyvaultName: "${KV_NAME}"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: mensaje-lab
          objectType: secret
